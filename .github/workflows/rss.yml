name: Actualiser RSS CITA
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itlf-cita-rss
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convertir DATEX II en RSS
        run: python convert.py
      - name: Enregistrer le flux et l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rss.xml docs/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour du RSS CITA"
            git push
          fi
